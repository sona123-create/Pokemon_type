<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Type Predictor</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #20283a;
      background: #f3f6fb;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      place-items: center;
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid #e1e7f0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px #24304a12;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
    }

    .intro {
      margin: 0 0 24px;
      color: #5d687c;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 650;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd4e1;
      border-radius: 9px;
      font: inherit;
    }

    input:focus {
      border-color: #536fe8;
      outline: 3px solid #536fe833;
    }

    .error {
      color: #b42318;
      font-size: 0.875rem;
      font-weight: 500;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #435bd5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #354bc0;
    }

    .result {
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: #edf7f0;
      color: #185c31;
      text-align: center;
    }

    .result p {
      margin: 0;
    }

    .result strong {
      display: block;
      margin-top: 4px;
      font-size: 1.8rem;
      text-transform: capitalize;
    }

    @media (max-width: 480px) {
      main {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pokémon Type Predictor</h1>
    <p class="intro">Enter a Pokémon’s measurements and base stats to predict its primary type.</p>

    <form method="post">
      <div class="fields">
        {% for feature in features %}
        <label for="{{ feature }}">
          {{ feature.replace('_', ' ')|title }}
          <input
            id="{{ feature }}"
            name="{{ feature }}"
            type="number"
            min="0"
            step="any"
            value="{{ form_values[feature] }}"
            required
            {% if errors.get(feature) %}
            aria-invalid="true"
            aria-describedby="{{ feature }}-error"
            {% endif %}
          >
          {% if errors.get(feature) %}
          <span class="error" id="{{ feature }}-error">{{ errors[feature] }}</span>
          {% endif %}
        </label>
        {% endfor %}
      </div>
      <button type="submit">Predict type</button>
    </form>

    {% if prediction %}
    <section class="result" aria-live="polite">
      <p>Predicted type_1</p>
      <strong>{{ prediction }}</strong>
    </section>
    {% endif %}
  </main>
</body>
</html>
